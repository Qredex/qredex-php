version: 1
project:
  name: qredex/php
  description: Canonical PHP server SDK for the Qredex Integrations API
  type: library
metadata:
  team: sdk
  owner: qredex
  repo_class: php-sdk
runtimes:
  php: '>=8.2'
execution:
  default_context: app
  contexts:
    host:
      backend: native
    app:
      backend: container
      lifecycle: ephemeral
      container:
        image: composer:2.9.7
        engines:
          - docker
          - podman
tools:
  bash: '*'
  composer: '2'
tasks:
  setup:
    description: Install PHP dependencies
    notes: |
      Use this first after cloning or when dependencies change.
    category: setup
    command:
      exe: composer
      args: [install]
    safe_for_agent: true
  analyse:
    description: Run static analysis
    notes: |
      Use this to catch PHP issues before running the heavier test suites.
    category: test
    command:
      exe: composer
      args: [run, analyse]
    depends_on:
      - setup
    safe_for_agent: true
  check:
    description: Run the combined PHP checks
    notes: |
      Use this as the combined lint and quality gate.
    category: test
    command:
      exe: composer
      args: [run, check]
    depends_on:
      - setup
    safe_for_agent: true
  test:
    description: Run the PHP unit tests
    notes: |
      Use this for the standard unit test pass.
    category: test
    command:
      exe: composer
      args: [run, test]
    depends_on:
      - setup
    safe_for_agent: true
  test:live:
    description: Run the live PHP tests
    notes: |
      Use this when the live integration environment is available.
    category: test
    command:
      exe: composer
      args: [run, test:live]
    depends_on:
      - setup
    safe_for_agent: true
  package:smoke:
    description: Verify the production dependency graph without dev packages
    notes: |
      Use this to confirm the package still installs cleanly in a production-style dependency set.
    category: test
    command:
      exe: composer
      args: [install, --no-interaction, --prefer-dist, --no-dev]
    depends_on:
      - setup
    safe_for_agent: true
  version:bump:
    description: Bump the release version
    notes: |
      Use this when preparing a PHP release and updating the package version.
      You can pass `major`, `minor`, `patch`, or an explicit semantic version.
      Typical flow:
        ota run version:bump --version minor
        ota run ci
      Direct script usage can set `OTA_INPUT_VERSION` explicitly:
        OTA_INPUT_VERSION=minor ./bump-version.sh
    category: release
    command:
      exe: ./bump-version.sh
      args: []
    inputs:
      version:
        description: Release bump selector or semantic version to apply to the package
        required: true
      skip_validation:
        description: Skip composer check before staging the version bump
        default: false
        allowed:
          - true
          - false
  ci:
    description: Run the PHP verification suite
    notes: |
      Use this as the canonical local verification path before merging changes.
    category: test
    command:
      exe: composer
      args: [validate, --strict]
    after_success:
      - check
      - test
    depends_on:
      - setup
    safe_for_agent: true
workflows:
  default: verify
  verify:
    description: Canonical PHP SDK verification path.
    setup:
      task: setup
    run:
      task: ci
agent:
  posture: readiness_strict
  entrypoint: ci
  default_task: ci
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      source:
        kind: version
        version: v1.6.21
  safe_tasks:
    - analyse
    - check
    - test
    - test:live
    - package:smoke
    - ci
  verify_after_changes:
    - analyse
    - check
    - test
    - package:smoke
    - ci
  writable_paths:
    - src
    - tests
    - docs
    - examples
    - README.md
    - bump-version.sh
  protected_paths:
    - ota.yaml
    - vendor
    - composer.lock
  notes: |
    Use the Ota workflow first for setup, validation, and task execution.
    Treat Ota as the default workflow, the way npm is the default in Node repos.
    Use `ota validate` to verify the contract.
    Use `ota doctor` to inspect readiness and agent guidance.
    Use `ota tasks` to discover runnable repo actions.
    Use `ota up --workflow verify` for the canonical verification path.
    Use `ota run package:smoke` when you need to confirm the production dependency graph still installs cleanly.
    Keep the typed canonical backend flow explicit and stable.
    Use composer run check as the primary verification path.
